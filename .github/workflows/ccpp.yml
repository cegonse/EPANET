name: linux

on: 
  push:
  pull_request: 
  schedule: 
    - cron: '0 0 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build directory
        run: mkdir buildproducts
      
      - name: CMake
        working-directory: ./buildproducts
        run: |
          retry=0
          max_retries=3
          until cmake ..; do
            retry=$((retry+1))
            echo "Retry $retry/$max_retries..."
            if [ "$retry" -ge "$max_retries" ]; then
              echo "CMake configuration failed after $max_retries attempts."
              exit 1
            fi
            sleep 10
          done
      
      - name: Make
        working-directory: ./buildproducts
        run: |
          retry=0
          max_retries=3
          until make; do
            retry=$((retry+1))
            echo "Retry $retry/$max_retries..."
            if [ "$retry" -ge "$max_retries" ]; then
              echo "Make build failed after $max_retries attempts."
              exit 1
            fi
            sleep 10
          done
      
      - name: Copy header files to build directory
        run: |
          cp include/epanet2.h buildproducts/
          cp include/epanet2_2.h buildproducts/
          cp include/epanet2_enums.h buildproducts/
          
      - uses: actions/upload-artifact@v4
        with:
          name: libepanet-output
          path: buildproducts/

  test-undefined-behavior:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install Boost
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-test-dev libboost-system-dev \
            libboost-thread-dev libboost-filesystem-dev

      - name: CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B buildtests -DBUILD_TESTS=ON -DSANITIZERS_ENABLED=ON

      - name: Build
        run: cmake --build buildtests -j 4

      - name: Test
        working-directory: ./buildtests
        run: ctest --output-on-failure
